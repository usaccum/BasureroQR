<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Dónde va mi residuo? ♻️</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="container">
    <header>
      <h1>Clasificador de Residuos ♻️</h1>
      <p>Consulta en qué contenedor depositar tu desecho</p>
    </header>

    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Buscar residuo (ej. banano, lata, tortrix...)"
        autocomplete="off"
        autofocus
      />

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="organico">🟢 Orgánico</button>
        <button class="filter-btn" data-filter="inorganico">⚫ Inorgánico</button>
        <button class="filter-btn" data-filter="reciclable">🔵 Reciclable</button>
      </div>
    </div>

    <main class="results" id="resultsList"></main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
